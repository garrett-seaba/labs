! device: P-02 (vEOS-lab, EOS-4.35.3F)
!
service routing protocols model multi-agent
!
hostname P-02
!
spanning-tree mode mstp
!
interface Ethernet1
   no switchport
   ip address 10.100.2.4/31
   isis enable UNDERLAY
   isis circuit-type level-2
   isis network point-to-point
!
interface Ethernet2
   no switchport
   ip address 10.100.2.6/31
   isis enable UNDERLAY
   isis circuit-type level-2
   isis network point-to-point
!
interface Loopback0
   ip address 10.100.1.2/32
   isis enable UNDERLAY
   isis passive
!
ip routing
!
router isis UNDERLAY
   net 49.0001.0100.0001.0002.00
   router-id ipv4 10.100.1.2
   !
   address-family ipv4 unicast
!
end
